name: Fork checks and release batch
on:
  pull_request:
    branches: [fork]
  push:
    branches: [fork]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.2
          ci/install-tools.sh "$RUNNER_TEMP/tools"
      - name: Check SemVer and changelog policy
        run: |
          ci/install-cliff.sh "$RUNNER_TEMP/cliff"
          export PATH="$RUNNER_TEMP/cliff:$PATH"
          ci/test-semver.sh
          ci/test-publisher.sh
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            ci/semver.sh verify
          else
            base=$(git describe --first-parent --abbrev=0 --tags --match 'helmod-fork-[0-9]*')
            [[ $(jq -r .version src/info.json) == "${base#helmod-fork-}" ]]
            git diff --exit-code "$base" -- src/changelog.txt
          fi
      - name: Preview the version for this squash title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          preview="$RUNNER_TEMP/title-preview"
          git worktree add --detach "$preview" "$BASE_SHA"
          # Read the proposed policy, even on the PR introducing it.
          cp cliff.toml "$preview/cliff.toml"
          cd "$preview"
          tag=$(PATH="$RUNNER_TEMP/cliff:$PATH" "$GITHUB_WORKSPACE/ci/semver.sh" plan "$PR_TITLE")
          echo "Expected release from this squash title: ${tag:-no release}." >> "$GITHUB_STEP_SUMMARY"
      - name: Check Lua syntax and typed modules
        run: |
          find src test -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.2 -p
          LUA_LANGUAGE_SERVER="$RUNNER_TEMP/tools/luals/bin/lua-language-server" ci/check-types.sh
      - name: Run engine and regression tests
        run: |
          engine="$RUNNER_TEMP/tools/factorio"
          ci/fetch-repros.sh "$RUNNER_TEMP/repros"
          for mode in integration base-only timing; do
            flags=()
            if [[ $mode != integration ]]; then flags=("--$mode"); fi
            lua5.2 test/run_orbit.lua "$engine/bin/x64/factorio" --data "$engine/data" "${flags[@]}"
          done
          lua5.2 test/run_fork_repros.lua "$engine/bin/x64/factorio" "$engine/data" "$RUNNER_TEMP/repros" --headless
      - name: Package and test the release archive
        run: |
          ci/package.sh dist
          ci/test-package.sh "$RUNNER_TEMP/tools/factorio" dist/*.zip "$RUNNER_TEMP/repros/custom-recipe-quality/repro.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmod-fork-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: check
    if: github.repository == 'Szer/helmod' && github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'helmod-fork-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: portal-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helmod-fork-package
          path: dist
      - name: Publish verified archive
        run: ci/publish.sh dist
        env:
          FACTORIO_APIKEY: ${{ secrets.FACTORIO_APIKEY }}

  auto-release:
    needs: check
    if: github.repository == 'Szer/helmod' && github.ref == 'refs/heads/fork' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: fork-version-and-tag
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version and dispatch eligible releases
        run: |
          ci/install-cliff.sh "$RUNNER_TEMP/cliff"
          export PATH="$RUNNER_TEMP/cliff:$PATH"
          ci/auto-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
