name: PR title
on:
  pull_request:
    branches: [fork]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            break
            chore
            docs
            test
            ci
            build
            refactor
            style
          headerPattern: '^(\w+)(?:\(([^)]+)\))?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          subjectPattern: '^.{5,90}$'
          subjectPatternError: 'Use a concise subject that makes sense as a standalone changelog bullet.'
  release-note:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release note
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ci/test-release-note.sh
          ci/release-note.sh "$PR_TITLE" <<< "$PR_BODY" > /dev/null
