[changelog]
header = ""
body = """
---------------------------------------------------------------------------------------------------
Version: {{ version | trim_start_matches(pat="helmod-fork-") }}
Date: {{ timestamp | date(format="%Y-%m-%d") }}
{%- for group, changes in commits | group_by(attribute="group") %}
  {{ group }}:
{%- for change in changes %}
    - {{ change.message | split(pat="\n") | first | trim }}
{%- endfor %}
{%- endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = '^helmod-fork-[0-9]+\.[0-9]+\.[0-9]+$'
commit_preprocessors = [{ pattern = ' \(#[0-9]+\)$', replace = "" }]
commit_parsers = [
  { message = "^break(\\(.+\\))?:", group = "Changes" },
  { message = "^feat(\\(.+\\))?:", group = "Features" },
  { message = "^fix(\\(.+\\))?:", group = "Bugfixes" },
  { message = ".*", skip = true },
]

[bump]
custom_major_increment_regex = "^break$"
features_always_bump_minor = true
breaking_always_bump_major = true
